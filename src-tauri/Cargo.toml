[package]
name = "fastpas"
default-run = "fastpas"
version = "0.1.0"
description = "FastPAS standalone CyberArk token helper"
authors = ["ferrum"]
edition = "2021"

[lib]
name = "fastpas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", default-features = false, features = ["linux-native", "windows-native", "apple-native"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.4.2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4", "serde"] }
